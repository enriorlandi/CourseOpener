<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8" />
    <style>
      body {
        width: 285px;
        margin: 0;
        padding: 14px;
        font: 13px/1.4 system-ui, -apple-system, sans-serif;
        color: #1c1c1e;
        background: #fff;
      }
      h1 {
        margin: 0 0 2px;
        font-size: 15px;
      }
      p.sub {
        margin: 0 0 12px;
        color: #6b6b70;
        font-size: 11px;
      }
      label {
        display: flex;
        align-items: flex-start;
        gap: 8px;
        padding: 7px 0;
        cursor: pointer;
      }
      label span small {
        display: block;
        color: #6b6b70;
        font-size: 11px;
      }
      input[type='checkbox'] {
        margin: 2px 0 0;
      }
      .row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        padding: 7px 0;
      }
      .row small {
        display: block;
        color: #6b6b70;
        font-size: 11px;
      }
      select {
        font: inherit;
        padding: 2px 4px;
      }
      hr {
        border: 0;
        border-top: 1px solid #e6e6ea;
        margin: 10px 0;
      }
      #status {
        color: #6b6b70;
        font-size: 11px;
      }
      #warn:not(:empty) {
        margin-top: 8px;
        padding: 7px 8px;
        border-radius: 6px;
        background: #fff4e5;
        color: #8a5300;
        font-size: 11px;
      }
      #reload {
        margin-top: 10px;
        width: 100%;
        padding: 6px;
        font: inherit;
        border: 1px solid #d0d0d5;
        border-radius: 6px;
        background: #f5f5f7;
        color: inherit;
        cursor: pointer;
      }
      #reload:hover {
        background: #ebebf0;
      }
      @media (prefers-color-scheme: dark) {
        body {
          color: #f2f2f7;
          background: #1c1c1e;
        }
        p.sub,
        label span small,
        .row small,
        #status {
          color: #98989f;
        }
        hr {
          border-top-color: #38383a;
        }
        #warn:not(:empty) {
          background: #3a2a10;
          color: #ffcf8a;
        }
        #reload {
          border-color: #48484a;
          background: #2c2c2e;
        }
        #reload:hover {
          background: #38383a;
        }
      }
    </style>
  </head>
  <body>
    <h1>VideoGo</h1>
    <p class="sub">Play al caricamento, sulla piattaforma FAD ForMe</p>

    <label>
      <input type="checkbox" id="enabled" />
      <span><strong>Attivo</strong></span>
    </label>

    <hr />

    <div class="row">
      <span>
        Volume all'avvio
        <small>Non usare "muto": Chrome rallenta in background le schede silenziose.</small>
      </span>
      <select id="startVolume">
        <option value="0">Muto</option>
        <option value="5">5%</option>
        <option value="10">10%</option>
        <option value="30">30%</option>
        <option value="100">100%</option>
      </select>
    </div>

    <div class="row">
      <span>
        Qualita' video
        <small>Piu' bassa = meno banda e meno CPU. Per una lezione parlata 240p basta.</small>
      </span>
      <select id="startQuality">
        <option value="240p">240p</option>
        <option value="360p">360p</option>
        <option value="540p">540p</option>
        <option value="720p">720p</option>
        <option value="1080p">1080p</option>
        <option value="auto">Auto</option>
      </select>
    </div>

    <label>
      <input type="checkbox" id="lastResortMute" />
      <span
        >Muta come ultima spiaggia
        <small>Solo se Chrome rifiuta l'autoplay con audio. Il video parte, ma la scheda
          diventa vulnerabile al blocco in background.</small></span
      >
    </label>

    <label>
      <input type="checkbox" id="clickPlayButton" />
      <span>Clicca il pulsante play <small>Solo sui player riconosciuti.</small></span>
    </label>

    <label>
      <input type="checkbox" id="resumeIfPaused" />
      <span
        >Sorveglia dopo l'avvio
        <small>Rimette in play se il video si ferma. Lascialo spento: se il sito gestisce
          già la sequenza, interferisce.</small></span
      >
    </label>

    <hr />
    <div id="status">…</div>
    <div id="warn"></div>
    <button id="reload" type="button">Ricarica questa pagina</button>

    <script src="popup.js"></script>
  </body>
</html>
